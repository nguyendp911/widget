name: ThienNienViet
options:
  bundleIdPrefix: com.viepn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "3.5.0"
    CURRENT_PROJECT_VERSION: "26"
    CODE_SIGN_STYLE: Automatic

targets:
  ViePNWidgetPlus:
    type: application
    platform: iOS
    sources:
      - path: ViePNApp/ThienNienVietApp.swift
      - path: ViePNApp/Stores/HeritageStore.swift
      - path: ViePNApp/Views/Lunar/HeritageUI.swift
      - path: ViePNApp/Views/Lunar/HeritageAstrologyView.swift
      - path: ViePNApp/Views/Lunar/HeritageFamilyView.swift
      - path: ViePNApp/Views/Lunar/HeritageCalendarView.swift
      - path: Shared/Lunar/HeritageData.swift
      - path: ViePNApp/Stores/LunarFamilyStore.swift
      - path: ViePNApp/Views/Lunar/ThienNienHomeView.swift
      - path: ViePNApp/Views/Lunar/ThienNienLunarBoard.swift
      - path: ViePNApp/Views/Lunar/ThienNienSettingsView.swift
      - path: ViePNApp/Views/Lunar/ThienNienDetailSheet.swift
      - path: ViePNApp/Views/Lunar/LunarEventEditorView.swift
      - path: Shared/Theme/Color+Hex.swift
      - path: Shared/Lunar/Assets.xcassets
      - path: Shared/Lunar/VietnameseLunarCalendar.swift
      - path: Shared/Lunar/LunarAlmanacFacts.swift
      - path: Shared/Lunar/LunarFamilyEvents.swift
      - path: Shared/Lunar/LunarAppearance.swift
      - path: Shared/Lunar/LunarCulture.swift
      - path: Shared/Lunar/LunarHighlights.swift
      - path: Shared/Lunar/LunarICSExporter.swift
      - path: Shared/Lunar/ThienNienSection.swift
    info:
      path: ViePNApp/Info.plist
      properties:
        CFBundleDisplayName: "Thiên Niên Việt"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: "Cho phép kiểm tra và thêm ngày nhớ âm lịch vào lịch iPhone, tránh tạo sự kiện trùng."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
    entitlements:
      path: ViePNApp/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.viepn.widgetplus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viepn.widgetplus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES

  ViePNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LunarOnlyTests.swift
    dependencies:
      - target: ViePNWidgetPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viepn.widgetplus.tests
