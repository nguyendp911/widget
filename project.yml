name: ViePNWidgetPlus
options:
  bundleIdPrefix: com.viepn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "2.2.7"
    CURRENT_PROJECT_VERSION: "10"
    CODE_SIGN_STYLE: Automatic

targets:
  ViePNWidgetPlus:
    type: application
    platform: iOS
    sources:
      - path: ViePNApp
      - path: Shared
    info:
      path: ViePNApp/Info.plist
      properties:
        CFBundleDisplayName: "ViePN Widget+"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - viepnwidgetplus
            CFBundleURLName: com.viepn.widgetplus.navigation
    entitlements:
      path: ViePNApp/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.viepn.widgetplus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viepn.widgetplus
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: ViePNWidgets
        embed: true

  ViePNWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Shared
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: "ViePN Widgets"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetExtension/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.viepn.widgetplus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viepn.widgetplus.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  ViePNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ViePNWidgetPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viepn.widgetplus.tests
