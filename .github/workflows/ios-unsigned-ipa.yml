name: Thiên Niên Việt - unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iphone:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate standalone lunar app
        run: python3 scripts/validate_lunar_app.py
      - name: Test lunar conversion and recurring memorials
        run: bash scripts/run_lunar_smoke.sh
      - name: Generate Xcode
        run: xcodegen generate
      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ThienNienViet.xcodeproj -scheme ViePNWidgetPlus \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/lunar-simulator" \
            CODE_SIGNING_ALLOWED=NO build-for-testing \
            2>&1 | tee "$RUNNER_TEMP/lunar-simulator-build.log"
      - name: Build iPhone application without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ThienNienViet.xcodeproj -scheme ViePNWidgetPlus \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/lunar-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/lunar-device-build.log"
      - name: Verify clean standalone app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/lunar-device/Build/Products/Release-iphoneos/ViePNWidgetPlus.app"
          test -d "$APP"
          test ! -d "$APP/PlugIns"
          test -s "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.viepn.widgetplus'
          echo "Confirmed standalone lunar iOS app without Widget Extension"
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/lunar-device/Build/Products/Release-iphoneos/ViePNWidgetPlus.app"
          mkdir -p "$RUNNER_TEMP/lunar-payload/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/lunar-payload/Payload/"
          (cd "$RUNNER_TEMP/lunar-payload" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/ThienNienViet-unsigned.ipa" Payload)
          unzip -t dist/ThienNienViet-unsigned.ipa | tail -1
          shasum -a 256 dist/ThienNienViet-unsigned.ipa > dist/SHA256SUMS.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Thien-Nien-Viet-iOS-Unsigned-IPA
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload simulator build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Thien-Nien-Viet-Simulator-Build-Log
          path: ${{ runner.temp }}/lunar-simulator-build.log
          if-no-files-found: ignore
      - name: Upload iPhone build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Thien-Nien-Viet-iPhone-Build-Log
          path: ${{ runner.temp }}/lunar-device-build.log
          if-no-files-found: ignore
