name: ViePN Widget+ - Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate starter
        run: python3 scripts/validate_source.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build tests for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ViePNWidgetPlus.xcodeproj \
            -scheme ViePNWidgetPlus \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ViePNTestsDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/viepn-tests-build.log"

      - name: Build unsigned device app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ViePNWidgetPlus.xcodeproj \
            -scheme ViePNWidgetPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ViePNDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/viepn-xcodebuild.log"

      - name: Package Payload into unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ViePNDerivedData/Build/Products/Release-iphoneos/ViePNWidgetPlus.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/viepn-payload/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/viepn-payload/Payload/"
          (cd "$RUNNER_TEMP/viepn-payload" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/ViePN-WidgetPlus-unsigned.ipa" Payload)
          unzip -t dist/ViePN-WidgetPlus-unsigned.ipa | tail -1
          unzip -l dist/ViePN-WidgetPlus-unsigned.ipa | grep 'Payload/ViePNWidgetPlus.app/Info.plist'
          shasum -a 256 dist/ViePN-WidgetPlus-unsigned.ipa > dist/SHA256SUMS.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViePN-WidgetPlus-unsigned-IPA
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test-build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ViePN-tests-build-diagnostics
          path: ${{ runner.temp }}/viepn-tests-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Xcode build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ViePN-xcodebuild-diagnostics
          path: ${{ runner.temp }}/viepn-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
